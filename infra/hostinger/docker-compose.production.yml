services:
  webavaliacao:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: webavaliacao-dancando
    restart: always
    depends_on:
      - whisper
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SupabaseConnection: ${SUPABASE_CONNECTION_STRING}
      AudioProcessing__FfmpegPath: ffmpeg
      Whisper__BaseUrl: http://whisper:9000/
      Whisper__Model: whisper-1
      Whisper__Language: pt
      Whisper__ApiKey: ${WHISPER_API_KEY}
      Whisper__TimeoutSeconds: 600
      SupabaseStorage__ProjectUrl: https://kxjnljuanbhlopuhvtog.supabase.co
      SupabaseStorage__SecretKey: ${SUPABASE_STORAGE_SECRET_KEY}
      SupabaseStorage__Bucket: avaliacao-audio

  whisper:
    image: hwdsl2/whisper-server
    container_name: whisper
    restart: always
    expose:
      - "9000"
    volumes:
      - whisper-data:/var/lib/whisper
      - ./whisper.env:/whisper.env:ro

volumes:
  whisper-data:
    name: whisper-data
